# docker-compose.yml — EduCorp Development Stack
#
# Usage:
#   docker compose up -d                          → Core infra + gateway only (fast start)
#   docker compose --profile messaging up -d      → + Kafka, RabbitMQ, Schema Registry
#   docker compose --profile workflow up -d        → + Temporal
#   docker compose --profile observability up -d   → + Prometheus, Grafana, Jaeger
#   docker compose --profile app up -d             → + All application services
#   docker compose --profile full up -d            → Everything
#   docker compose --profile debug up -d           → App services with debugpy on 5678+

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - educorp
  env_file:
    - .env

x-python-service: &python-service
  <<: *service-defaults
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.service
    target: dev
  command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/service", "--reload-dir", "/app/shared"]
  volumes:
    - ./shared:/app/shared:ro

x-dev-worker: &dev-worker
  <<: *python-service
  command: ["python", "-m", "app.worker"]

x-dev-celery-worker: &dev-celery-worker
  <<: *python-service
  command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]

x-resource-small: &resource-small
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: "0.25"

x-resource-medium: &resource-medium
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "0.50"

x-resource-large: &resource-large
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: "0.50"

services:
  # ─── Core Infrastructure (always starts) ───────────────
  postgres:
    image: postgres:16-alpine
    <<: [*service-defaults, *resource-medium]
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-educorp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educorp_dev}
      POSTGRES_DB: ${POSTGRES_DB:-educorp}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-educorp}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

  mongodb:
    image: mongo:7
    <<: [*service-defaults, *resource-medium]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-educorp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-educorp_dev}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *service-defaults
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-educorp_dev} --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-educorp_dev}", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.6
    <<: [*service-defaults, *resource-medium]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD ' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    <<: [*service-defaults, *resource-small]
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-educorp}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-educorp_dev}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ─── API Gateway (always starts) ───────────────────────
  traefik:
    image: traefik:v3.0
    <<: *service-defaults
    ports:
      - "80:80"
      - "8081:8080"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TRAEFIK_CORS_ORIGIN_1: ${TRAEFIK_CORS_ORIGIN_1:-http://localhost}
      TRAEFIK_CORS_ORIGIN_2: ${TRAEFIK_CORS_ORIGIN_2:-http://localhost:3001}
      TRAEFIK_CORS_ORIGIN_3: ${TRAEFIK_CORS_ORIGIN_3:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ─── Messaging ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    <<: *service-defaults
    profiles: [messaging, full, debug]
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256m"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    <<: *service-defaults
    profiles: [messaging, full, debug]
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_NUM_PARTITIONS: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.50"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infra/kafka/topics.sh:/opt/kafka-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 15s
      timeout: 30s
      start_period: 60s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    profiles: [messaging, full, debug]
    networks:
      - educorp
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/topics.sh:/opt/kafka-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/kafka-topics.sh"]
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    <<: *service-defaults
    profiles: [messaging, full, debug]
    ports:
      - "8082:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx128m"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    <<: *service-defaults
    profiles: [messaging, full, debug]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-educorp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-educorp_dev}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 10

  # ─── Workflow Engine ───────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    <<: [*service-defaults, *resource-medium]
    profiles: [workflow, full, debug]
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-educorp}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-educorp_dev}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1C41 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10

  temporal-init:
    image: temporalio/auto-setup:1.24.2
    <<: *service-defaults
    profiles: [workflow, full, debug]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until temporal operator namespace describe --namespace educorp --address temporal:7233 > /dev/null 2>&1; do
          echo "Registering educorp namespace...";
          temporal operator namespace create --namespace educorp --retention 72h \
            --description "EduCorp publishing workflows" --address temporal:7233 2>&1 || true;
          sleep 3;
        done;
        echo "Namespace educorp is ready."
    depends_on:
      temporal:
        condition: service_healthy
    restart: "no"

  temporal-ui:
    image: temporalio/ui:2.26.2
    <<: *service-defaults
    profiles: [workflow, full, debug]
    ports:
      - "8088:8080"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  # ─── Observability ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    <<: [*service-defaults, *resource-small]
    profiles: [observability, full, debug]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=1GB'

  grafana:
    image: grafana/grafana:10.4.0
    <<: [*service-defaults, *resource-small]
    profiles: [observability, full, debug]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.55
    <<: [*service-defaults, *resource-small]
    profiles: [observability, full, debug]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "badger"
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: "/badger/data"
      BADGER_DIRECTORY_KEY: "/badger/key"
    volumes:
      - jaeger_data:/badger

  # ─── Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    <<: [*service-defaults, *resource-small]
    profiles: [app, full, debug]
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: "http://traefik"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
      - frontend_node_modules:/app/node_modules
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

  # ─── Application Services ──────────────────────────────
  auth-service:
    <<: *python-service
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/auth
    environment:
      SERVICE_NAME: auth-service
    volumes:
      - ./shared:/app/shared:ro
      - ./services/auth:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  course-service:
    <<: *python-service
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/course
    environment:
      SERVICE_NAME: course-service
    volumes:
      - ./shared:/app/shared:ro
      - ./services/course:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy

  enrollment-service:
    <<: *python-service
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/enrollment
    environment:
      SERVICE_NAME: enrollment-service
    volumes:
      - ./shared:/app/shared:ro
      - ./services/enrollment:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  progress-service:
    <<: *python-service
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/progress
    environment:
      SERVICE_NAME: progress-service
    volumes:
      - ./shared:/app/shared:ro
      - ./services/progress:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  publishing-service:
    <<: *python-service
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/publishing
    environment:
      SERVICE_NAME: publishing-service
    volumes:
      - ./shared:/app/shared:ro
      - ./services/publishing:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false

  publishing-worker:
    <<: *dev-worker
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/publishing
    environment:
      SERVICE_NAME: publishing-worker
    volumes:
      - ./shared:/app/shared:ro
      - ./services/publishing:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-service:
    <<: *python-service
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/ai
    environment:
      SERVICE_NAME: ai-service
    volumes:
      - ./shared:/app/shared:ro
      - ./services/ai:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  search-service:
    <<: *python-service
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/search
    environment:
      SERVICE_NAME: search-service
    volumes:
      - ./shared:/app/shared:ro
      - ./services/search:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  notification-service:
    <<: *python-service
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/notification
    environment:
      SERVICE_NAME: notification-service
    volumes:
      - ./shared:/app/shared:ro
      - ./services/notification:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        required: false
      kafka:
        condition: service_healthy
        required: false

  notification-worker:
    <<: *dev-celery-worker
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/notification
    environment:
      SERVICE_NAME: notification-worker
    volumes:
      - ./shared:/app/shared:ro
      - ./services/notification:/app/service
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy

  analytics-service:
    <<: *python-service
    profiles: [app, full, debug]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      target: dev
      args:
        SERVICE_DIR: services/analytics
    environment:
      SERVICE_NAME: analytics-service
    volumes:
      - ./shared:/app/shared:ro
      - ./services/analytics:/app/service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  qdrant_data:
  minio_data:
  zookeeper_data:
  kafka_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  jaeger_data:
  frontend_node_modules:

networks:
  educorp:
    driver: bridge
