[project]
name = "educorp-ai"
version = "0.1.0"
description = "EduCorp AI Service"
requires-python = ">=3.12"
dependencies = [
    "educorp-common",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiokafka>=0.10.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "langchain>=0.2.0",
    "langgraph>=0.0.30",
    "langsmith>=0.7.31",
    "motor>=3.4.0",
    "qdrant-client>=1.9.0",
    "sse-starlette>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
