[project]
name = "educorp-auth"
version = "0.1.0"
description = "EduCorp Auth Service"
requires-python = ">=3.12"
dependencies = [
    "educorp-common",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
